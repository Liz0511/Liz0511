<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#0A1F4D"/>
      <stop offset="1" stop-color="#13306E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.5" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset="1" stop-color="#E8D9A8"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}
      .s2{animation-delay:1s}.s3{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .bolt{animation:fl 2.5s ease-in-out infinite}
      @keyframes fl{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.3}55%{opacity:1}}
      .title{font-family:Georgia,'Times New Roman',serif;font-weight:bold}
      .sub{font-family:Georgia,'Times New Roman',serif;font-style:italic}
      .owl{animation:fly 14s linear infinite}
      @keyframes fly{0%{transform:translate(-80px,0)}100%{transform:translate(1080px,-40px)}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="18" fill="url(#sky)"/>
  <!-- stars -->
  <g>
    <circle class="s" cx="60" cy="40" r="1.6"/><circle class="s s2" cx="130" cy="90" r="1.2"/><circle class="s s3" cx="210" cy="30" r="1.8"/>
    <circle class="s s2" cx="300" cy="70" r="1.1"/><circle class="s" cx="380" cy="25" r="1.5"/><circle class="s s3" cx="470" cy="55" r="1.2"/>
    <circle class="s" cx="560" cy="20" r="1.7"/><circle class="s s2" cx="640" cy="80" r="1.1"/><circle class="s s3" cx="720" cy="35" r="1.4"/>
    <circle class="s" cx="900" cy="140" r="1.3"/><circle class="s s2" cx="960" cy="60" r="1.6"/><circle class="s s3" cx="40" cy="150" r="1.2"/>
    <circle class="s s2" cx="250" cy="140" r="1"/><circle class="s" cx="610" cy="130" r="1"/><circle class="s s3" cx="350" cy="120" r="1.3"/>
  </g>
  <!-- moon -->
  <circle cx="840" cy="75" r="38" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="826" cy="66" r="6" fill="#D8C893" opacity=".6"/><circle cx="852" cy="88" r="4" fill="#D8C893" opacity=".5"/>
  <!-- owl -->
  <g class="owl"><path d="M0 120 q12 -12 24 0 q12 -12 24 0 q-12 4 -24 2 q-12 2 -24 -2z" fill="#0B1530"/></g>
  <!-- castle silhouette -->
  <g fill="#050C22">
    <path d="M0 320 V270 H40 V245 H55 L62 225 L69 245 H84 V270 H120 V255 H140 V280 H180 V240 H195 L205 205 L215 240 H230 V285 H270 V320Z"/>
    <path d="M720 320 V275 H750 V230 H762 L772 190 L782 230 H794 V262 H820 V215 H832 L845 170 L858 215 H870 V255 H900 V235 H912 L920 215 L928 235 H940 V270 H1000 V320Z"/>
  </g>
  <g fill="#FFD66B" opacity=".85">
    <rect x="200" y="250" width="5" height="9" rx="2"/><rect x="841" y="225" width="6" height="10" rx="3"/><rect x="767" y="245" width="5" height="9" rx="2"/><rect x="58" y="255" width="5" height="8" rx="2"/>
  </g>
  <!-- bolt -->
  <path class="bolt" filter="url(#glow)" d="M498 40 L476 92 H496 L482 132 L520 78 H499 L512 40Z" fill="url(#gold)"/>
  <!-- title -->
  <text class="title" x="500" y="195" text-anchor="middle" font-size="64" fill="url(#gold)" filter="url(#glow)" letter-spacing="4">Liz0511</text>
  <text class="sub" x="500" y="235" text-anchor="middle" font-size="20" fill="#C9D6FF">“I solemnly swear that I am up to no good.”</text>
  <line x1="380" y1="252" x2="620" y2="252" stroke="url(#gold)" stroke-width="1.5"/>
  <text class="sub" x="500" y="275" text-anchor="middle" font-size="14" fill="#D4AF37" letter-spacing="3">CODE · MAGIC · OPEN SOURCE</text>
</svg>
