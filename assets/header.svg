<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01040F"/><stop offset=".5" stop-color="#081A45"/><stop offset="1" stop-color="#11306F"/>
    </linearGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B5BDB" stop-opacity=".35"/><stop offset="1" stop-color="#3B5BDB" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4AF37" stop-opacity=".18"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#E2D3A0"/></radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#9C7A1E"/><stop offset=".40" stop-color="#D4AF37"/>
      <stop offset=".50" stop-color="#FFF6CF"/><stop offset=".60" stop-color="#D4AF37"/><stop offset="1" stop-color="#9C7A1E"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-700 0;700 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A3"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}.d1{animation-delay:.7s}.d2{animation-delay:1.4s}.d3{animation-delay:2.1s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .flame{animation:fl .35s ease-in-out infinite alternate;transform-origin:center}
      @keyframes fl{from{opacity:.8}to{opacity:1}}
      .c1{animation:bob 4s ease-in-out infinite}.c2{animation:bob 5s ease-in-out infinite .8s}.c3{animation:bob 4.5s ease-in-out infinite 1.6s}.c4{animation:bob 5.5s ease-in-out infinite .4s}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .fall{animation:fall 6s linear infinite}
      @keyframes fall{0%{transform:translateY(-20px);opacity:0}10%{opacity:1}100%{transform:translateY(420px);opacity:0}}
      .hal{animation:spin 30s linear infinite;transform-origin:500px 205px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .bolt{animation:zap 3s ease-in-out infinite}
      @keyframes zap{0%,40%,60%,100%{opacity:1}45%{opacity:.2}50%{opacity:1}55%{opacity:.4}}
    </style>
  </defs>

  <rect width="1000" height="400" rx="22" fill="url(#sky)"/>
  <ellipse cx="220" cy="110" rx="260" ry="110" fill="url(#neb1)"/>
  <ellipse cx="760" cy="230" rx="300" ry="130" fill="url(#neb1)"/>
  <ellipse cx="500" cy="200" rx="330" ry="150" fill="url(#neb2)"/>

  <!-- stars -->
  <g>
    <circle class="s" cx="40" cy="30" r="1.4"/><circle class="s d1" cx="95" cy="85" r="1.1"/><circle class="s d2" cx="160" cy="40" r="1.8"/>
    <circle class="s d3" cx="230" cy="120" r="1"/><circle class="s" cx="290" cy="55" r="1.3"/><circle class="s d1" cx="345" cy="22" r="1.6"/>
    <circle class="s d2" cx="410" cy="95" r="1"/><circle class="s d3" cx="590" cy="30" r="1.5"/><circle class="s" cx="650" cy="100" r="1.1"/>
    <circle class="s d1" cx="700" cy="50" r="1.7"/><circle class="s d2" cx="950" cy="170" r="1.2"/><circle class="s d3" cx="975" cy="40" r="1.4"/>
    <circle class="s" cx="20" cy="190" r="1"/><circle class="s d2" cx="130" cy="210" r="1.2"/><circle class="s d1" cx="900" cy="230" r="1"/>
    <circle class="s d3" cx="540" cy="70" r="1"/><circle class="s" cx="455" cy="40" r="1.2"/><circle class="s d1" cx="620" cy="160" r="0.9"/>
  </g>

  <!-- falling gold sparks -->
  <g fill="#FFE9A3" filter="url(#glow)">
    <circle class="fall" cx="120" cy="0" r="1.6"/>
    <circle class="fall" style="animation-delay:1.5s" cx="330" cy="0" r="1.3"/>
    <circle class="fall" style="animation-delay:3s" cx="610" cy="0" r="1.5"/>
    <circle class="fall" style="animation-delay:4.2s" cx="880" cy="0" r="1.2"/>
    <circle class="fall" style="animation-delay:2.2s" cx="760" cy="0" r="1"/>
  </g>

  <!-- moon -->
  <circle cx="870" cy="80" r="44" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="855" cy="68" r="7" fill="#D6C48C" opacity=".55"/><circle cx="884" cy="96" r="5" fill="#D6C48C" opacity=".45"/>

  <!-- floating candles (Great Hall) -->
  <g>
    <g class="c1"><rect x="80" y="150" width="9" height="34" rx="2" fill="#F5EED8"/><ellipse class="flame" cx="84.5" cy="143" rx="4" ry="8" fill="#FFD66B" filter="url(#glow)"/></g>
    <g class="c2"><rect x="185" y="175" width="8" height="30" rx="2" fill="#F5EED8"/><ellipse class="flame" cx="189" cy="168" rx="3.5" ry="7" fill="#FFD66B" filter="url(#glow)"/></g>
    <g class="c3"><rect x="790" y="165" width="9" height="34" rx="2" fill="#F5EED8"/><ellipse class="flame" cx="794.5" cy="158" rx="4" ry="8" fill="#FFD66B" filter="url(#glow)"/></g>
    <g class="c4"><rect x="905" y="190" width="8" height="28" rx="2" fill="#F5EED8"/><ellipse class="flame" cx="909" cy="183" rx="3.5" ry="7" fill="#FFD66B" filter="url(#glow)"/></g>
  </g>

  <!-- Deathly Hallows sigil -->
  <g class="hal" opacity=".22" fill="none" stroke="#D4AF37" stroke-width="2">
    <path d="M500 95 L610 285 L390 285 Z"/><circle cx="500" cy="221" r="63"/><line x1="500" y1="95" x2="500" y2="285"/>
  </g>

  <!-- golden snitch -->
  <g filter="url(#glow)">
    <g>
      <ellipse cx="-14" cy="-4" rx="16" ry="5" fill="#F5EED8" opacity=".9">
        <animate attributeName="ry" values="5;1;5" dur=".18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="14" cy="-4" rx="16" ry="5" fill="#F5EED8" opacity=".9">
        <animate attributeName="ry" values="5;1;5" dur=".18s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="7" fill="url(#gold)"/>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="0"
        path="M-60 200 C 150 60, 300 330, 480 120 S 760 60, 860 250 S 1000 120, 1080 160"/>
    </g>
  </g>

  <!-- castle -->
  <g fill="#030919">
    <path d="M0 400 V330 H45 V300 H58 L66 270 L74 300 H88 V330 H130 V310 H150 V340 H195 V290 H210 L222 245 L234 290 H250 V345 H300 V400Z"/>
    <path d="M690 400 V340 H720 V285 H733 L745 235 L757 285 H770 V320 H800 V265 H814 L830 205 L846 265 H860 V310 H895 V285 H908 L917 260 L926 285 H940 V330 H1000 V400Z"/>
  </g>
  <g fill="#FFD66B">
    <rect x="218" y="305" width="6" height="10" rx="3"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="826" y="280" width="7" height="12" rx="3.5"/><rect x="741" y="300" width="5" height="9" rx="2.5"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="63" y="312" width="5" height="9" rx="2.5"/>
  </g>

  <!-- bolt -->
  <path class="bolt" filter="url(#glow)" d="M500 38 L476 92 H497 L482 134 L524 76 H501 L515 38Z" fill="url(#gold)"/>

  <!-- title -->
  <text class="serif" x="500" y="215" text-anchor="middle" font-size="78" font-weight="bold" letter-spacing="6" fill="url(#shine)" filter="url(#glow)">LIZ0511</text>
  <text class="serif" x="500" y="258" text-anchor="middle" font-size="21" font-style="italic" fill="#D7E1FF">Student @ Newton School of Technology</text>
  <path d="M360 278 H470 M530 278 H640" stroke="#D4AF37" stroke-width="1.4"/>
  <path d="M500 270 l8 8 l-8 8 l-8 -8z" fill="#D4AF37"/>
  <text class="serif" x="500" y="310" text-anchor="middle" font-size="14" letter-spacing="6" fill="#D4AF37">CODE · BUILD · OPEN SOURCE</text>
</svg>
