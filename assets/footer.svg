<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01040F"/><stop offset=".5" stop-color="#0A1F4D"/><stop offset="1" stop-color="#01040F"/></linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#9C7A1E"/><stop offset=".4" stop-color="#D4AF37"/><stop offset=".5" stop-color="#FFF6CF"/><stop offset=".6" stop-color="#D4AF37"/><stop offset="1" stop-color="#9C7A1E"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-700 0;700 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
