  <path d="M265 65 l9 -11 l9 11 l-9 11z M717 65 l9 -11 l9 11 l-9 11z" fill="#D4AF37"/>
  <text x="500" y="112" text-anchor="middle" font-size="13" fill="#8FA3D9" font-family="Georgia,serif" letter-spacing="4">NOX · THANKS FOR VISITING, MUGGLE</text>
