<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06122E"/><stop offset="1" stop-color="#0E2A63"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A3"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif}
      .ln{animation:ink 1s ease both}
      .l1{animation-delay:.2s}.l2{animation-delay:.6s}.l3{animation-delay:1s}.l4{animation-delay:1.4s}.l5{animation-delay:1.8s}.l6{animation-delay:2.2s}.l7{animation-delay:2.6s}.l8{animation-delay:3s}
      @keyframes ink{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      .seal{animation:pulse 2.5s ease-in-out infinite;transform-origin:860px 330px}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="964" height="394" rx="14" fill="none" stroke="url(#g)" stroke-width="2"/>
  <rect x="28" y="28" width="944" height="374" rx="10" fill="none" stroke="#D4AF37" stroke-opacity=".35" stroke-dasharray="4 6"/>
  <g fill="#D4AF37"><path d="M40 40 l14 0 l-14 14z"/><path d="M960 40 l-14 0 l14 14z"/><path d="M40 390 l14 0 l-14 -14z"/><path d="M960 390 l-14 0 l14 -14z"/></g>

  <text class="t" x="500" y="74" text-anchor="middle" font-size="30" font-weight="bold" letter-spacing="4" fill="url(#g)" filter="url(#glow)">ABOUT ME</text>
  <text class="t" x="500" y="100" text-anchor="middle" font-size="13" letter-spacing="4" fill="#8FA3D9">NEWTON SCHOOL OF TECHNOLOGY</text>

  <g class="t" font-size="18" fill="#E6ECFF">
    <text class="ln l1" x="70" y="150" font-style="italic" fill="#FFE9A3">Hi, I'm Liz0511</text>
    <text class="ln l2" x="70" y="185">Student developer at Newton School of Technology, learning</text>
    <text class="ln l3" x="70" y="212">by building projects and contributing to <tspan fill="#FFE9A3" font-weight="bold">open source</tspan>.</text>
    <text class="ln l4" x="92" y="255" font-size="16" fill="#C9D6FF">Currently: Working through the DevForge 10 PR Journey</text>
    <text class="ln l5" x="92" y="282" font-size="16" fill="#C9D6FF">Exploring: Audio + AI tools with local Whisper</text>
    <text class="ln l6" x="92" y="309" font-size="16" fill="#C9D6FF">Tech: Python, HTML, CSS, JavaScript, Git</text>
    <text class="ln l7" x="70" y="352" font-style="italic" fill="#8FA3D9" font-size="15">“Always learning. Always building.”</text>
    <text class="ln l8" x="70" y="385" font-size="15" fill="#D4AF37">Open to collaborations · Let's build something</text>
  </g>

  <g fill="#D4AF37"><path d="M76 249 l6 -6 l6 6 l-6 6z"/><path d="M76 276 l6 -6 l6 6 l-6 6z"/><path d="M76 303 l6 -6 l6 6 l-6 6z"/></g>
  <!-- wax seal -->
  <g class="seal" filter="url(#glow)">
    <circle cx="860" cy="330" r="46" fill="url(#g)"/>
    <circle cx="860" cy="330" r="36" fill="none" stroke="#7A5A0E" stroke-width="2"/>
    <text class="t" x="860" y="339" text-anchor="middle" font-size="26" font-weight="bold" fill="#5A400A">NST</text>
  </g>
</svg>
