<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .ln{stroke:#D4AF37;stroke-opacity:.55;stroke-width:1;fill:none;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 6s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:900}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
      .st{fill:#FFE9A3;animation:tw 2.6s ease-in-out infinite}
      .a{animation-delay:.4s}.b{animation-delay:.9s}.c{animation-delay:1.4s}.d{animation-delay:1.9s}
      @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <polyline class="ln" points="120,45 210,22 300,40 390,18 470,35 530,35 610,18 700,40 790,22 880,45"/>
  <g filter="url(#glow)">
    <circle class="st" cx="120" cy="45" r="2.2"/><circle class="st a" cx="210" cy="22" r="3"/><circle class="st b" cx="300" cy="40" r="2.2"/>
    <circle class="st c" cx="390" cy="18" r="3.2"/><circle class="st d" cx="470" cy="35" r="2.4"/><circle class="st a" cx="530" cy="35" r="2.4"/>
    <circle class="st b" cx="610" cy="18" r="3.2"/><circle class="st c" cx="700" cy="40" r="2.2"/><circle class="st d" cx="790" cy="22" r="3"/>
    <circle class="st" cx="880" cy="45" r="2.2"/>
  </g>
  <path d="M500 22 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z" fill="#FFE9A3" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" values="0 500 34;360 500 34" dur="10s" repeatCount="indefinite"/>
  </path>
</svg>
