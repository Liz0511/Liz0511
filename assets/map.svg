    <g id="fp"><ellipse cx="0" cy="0" rx="4" ry="7" fill="#D4AF37"/><circle cx="0" cy="-10" r="2.5" fill="#D4AF37"/></g>
    <style>
      .f{opacity:0;animation:step 6s linear infinite}
      @keyframes step{0%{opacity:0}4%{opacity:1}40%{opacity:1}55%{opacity:0}100%{opacity:0}}
