    <use href="#fp" class="f" x="700" y="38" transform="rotate(90 700 38)" style="animation-delay:1.8s"/>
    <use href="#fp" class="f" x="770" y="54" transform="rotate(90 770 54)" style="animation-delay:2.1s"/>
